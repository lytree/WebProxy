name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm test

      - name: Lint Firefox manifest
        run: |
          pnpm run build-ff
          pnpm exec web-ext lint --source-dir extension

      - name: Prepare CRX signing key
        env:
          CRX_PRIVATE_KEY: ${{ secrets.CRX_PRIVATE_KEY }}
        run: |
          if [ -z "$CRX_PRIVATE_KEY" ]; then
            echo "::warning::CRX_PRIVATE_KEY is not configured; .crx artifacts will use a random key and a different extension ID."
            exit 0
          fi
          printf '%s\n' "$CRX_PRIVATE_KEY" > key.pem
          chmod 600 key.pem

      - name: Build and package browser targets
        run: |
          for target in ch ed op ff ff-unlisted ff-android th; do
            echo "::group::$target"
            pnpm run "build-$target"
            version=$(node -p "require('./extension/manifest.json').version")
            pnpm run pack:zip
            mv extension.zip "WebProxy-v${version}-${target}.zip"
            case "$target" in
              ch|ed|op)
                pnpm run pack:crx
                mv extension.crx "WebProxy-v${version}-${target}.crx"
                ;;
              *)
                pnpm run pack:xpi
                mv extension.xpi "WebProxy-v${version}-${target}.xpi"
                ;;
            esac
            echo "::endgroup::"
          done

      - name: Upload packaged extensions
        uses: actions/upload-artifact@v4
        with:
          name: smartproxy-extensions
          path: WebProxy-*
          if-no-files-found: error
          retention-days: 14
