name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm test

      - name: Build and package browser targets
        run: |
          for target in ch ed op ff ff-unlisted ff-android th; do
            echo "::group::$target"
            pnpm run "build-$target"
            version=$(node -p "require('./extension/manifest.json').version")
            pnpm run pack:zip
            mv extension.zip "SmartProxy-v${version}-${target}.zip"
            echo "::endgroup::"
          done

      - name: Upload packaged extensions
        uses: actions/upload-artifact@v4
        with:
          name: smartproxy-extensions
          path: SmartProxy-*.zip
          if-no-files-found: error
          retention-days: 14
